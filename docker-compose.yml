version: '3.8'

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: firewall_central
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    depends_on:
      - database
    volumes:
      - ./certs:/var/www/html/certs:ro
    environment:
      DATABASE_URL: postgresql://app:password@database:5432/firewall_central
    ports:
      - "8080:80"
      - "8081:8081"
